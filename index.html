<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>AR-учебник — демонстрация</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background: #111827; color: white; }
    .panel {
      position: fixed; z-index: 5; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px;
      padding: 12px 14px; border-radius: 14px; background: rgba(17,24,39,.88);
      border: 1px solid rgba(255,255,255,.18); pointer-events: none;
    }
    .panel h1 { margin: 0 0 5px; font-size: 18px; }
    .panel p { margin: 0; font-size: 14px; line-height: 1.35; color: #e5e7eb; }
    #status { margin-top: 7px; font-weight: bold; color: #fde68a; }
    .help { position: fixed; z-index: 5; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); padding: 10px 12px; text-align: center; border-radius: 12px; background: rgba(17,24,39,.82); font-size: 13px; color: #e5e7eb; pointer-events: none; }
    .a-enter-vr, .a-enter-ar { display: none !important; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>AR-учебник: тест куба</h1>
    <p>Наведи камеру на распечатанную страницу-мишень.</p>
    <div id="status">Статус: загружаю AR…</div>
  </div>
  <div class="help">Держи страницу в кадре и избегай бликов. Для работы нужен интернет.</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiScanning: yes; filterMinCF: 0.0001; filterBeta: 0.001"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false"
    embedded>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Куб привязан к распознанной странице. Измени размеры/цвет при желании. -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-box position="0 0 0.18" width="0.22" height="0.22" depth="0.22"
        material="color: #2563eb; roughness: 0.35; metalness: 0.05"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
      </a-box>
      <a-light type="ambient" intensity="1.3"></a-light>
      <a-light type="directional" intensity="1.2" position="1 2 3"></a-light>
    </a-entity>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const scene = document.querySelector('a-scene');
    scene.addEventListener('loaded', () => {
      status.textContent = 'Статус: камера запускается…';
    });
    scene.addEventListener('arReady', () => {
      status.textContent = 'Статус: наведи камеру на страницу';
    });
    scene.addEventListener('arError', (event) => {
      status.textContent = 'Не удалось запустить AR. Проверь разрешение камеры и HTTPS.';
      console.error(event);
    });
    document.querySelector('[mindar-image-target]').addEventListener('targetFound', () => {
      status.textContent = 'Страница распознана — куб появился!';
    });
    document.querySelector('[mindar-image-target]').addEventListener('targetLost', () => {
      status.textContent = 'Страница не видна — наведи камеру снова';
    });
  </script>
</body>
</html>
